<img 
    src="/assets/images/Logo-Tik-Talk-small.svg" 
    class="ml16 mb20"
    alt="logo"
>

<nav>
    <ul class="main-menu-list">
        @for(item of menuItems; track item.link){
            <li>
                <button class="menu-item">
                    <svg [icon]="item.icon"></svg>
                    <span>{{ item.label }}</span>
                </button>
            </li>
        }
    </ul>    
</nav>    

<p class="medium-text mb-20 ml12 mt20 mb20 white-75-opacity">Подписчики</p>


@for (profile of subscribers$ | async ; track profile.id) {
    <app-subscriber-card [profile]="profile"></app-subscriber-card>
}


<div class="mt20 to-subscribers">
    <a [routerLink]="['/subscribers']" class="to-subscribers-link medium-text">
        Все подписчики
    </a>
    <svg icon="arrow-right" class="to-subscribers-icon"></svg>
</div>

<footer class="sidebar__footer">
    @if(me(); as me){
        @if(me.avatarUrl){
            <img [src] = "me.avatarUrl | imageUrl" alt="my avatar">
        } @else {
            <img src = "/assets/images/avatar-placeholder.svg">
        }

        <div class="medium-text username-text">{{ me.username }}</div>

        <a [routerLink] = "['settings']" class="settings-btn">
            <svg icon="settings" class="to-settings-icon"></svg>
        </a>
    }
    
</footer>
