@if(profile(); as profile){
    @if(profile.avatarUrl){
        <img [src] = "profile.avatarUrl | imageUrl" alt="my avatar">
    } @else {
        <img src = "/assets/images/avatar-placeholder.svg">
    }

    <div class="username-and-nickname">
        <h1 class="h4 mb4">{{ profile.firstName }} {{ profile.lastName }}</h1>
        <div class="regular">{{ profile.username }}</div>
    </div>
}
